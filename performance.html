<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>设备性能实测 · 林栖</title>
  <link rel="icon" href="/mark.svg">
  <style>
  *{box-sizing:border-box}body{margin:0;background:#eff0e6;color:#254536;font:15px system-ui}
  main{max-width:430px;margin:auto;padding:12px 16px 20px}header{display:flex;align-items:center;justify-content:space-between}h1{font:600 23px Georgia,serif}
  a{color:#315848}p{font-size:13px;line-height:1.5;margin:2px 0 12px}#stage{position:relative;width:min(100%,390px);height:min(58dvh,550px);background:#d9e8d5;border-radius:14px;overflow:hidden}
  canvas{display:block;width:100%;height:100%}pre{white-space:pre-wrap;font:14px/1.6 system-ui;margin:10px 0}button{font:600 15px system-ui;background:#335544;color:white;border:0;border-radius:9px;min-height:44px;padding:8px 16px}button:disabled{opacity:.55}
  </style>
</head>
<body><main>
  <header><h1>设备性能实测</h1><a href="./">返回林栖</a></header>
  <p>在独立的九地块江南场景中，以低画质自动漫步五分钟。请保持页面在前台。</p>
  <div id="stage"></div>
  <pre id="result">准备测试场景…</pre>
  <button id="begin" type="button" disabled>开始五分钟漫步</button>
</main><script type="module" src="/src/river-benchmark.js"></script></body>
</html>
